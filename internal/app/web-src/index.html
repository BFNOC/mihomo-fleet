<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <title>Mihomo Fleet</title>
  </head>
  <body>
    <div class="shell">
      <!-- Vue mount point: TopBar.vue supplies the contents. main.ts replaces
           the children of this element, so the wrapper and its class stay. -->
      <header class="topbar"></header>

      <main class="workspace">
        <!-- Vue mount point: SideBar.vue supplies the contents. -->
        <aside class="sidebar"></aside>

        <section class="content">
          <!-- Vue mount point: MessageBanner.vue renders the #message element
               itself, so it needs a host to be mounted into rather than being
               mounted onto #message directly. -->
          <div id="messageMount"></div>
          <!-- Every element below is a Vue mount host: main.ts replaces the
               children, so only the wrapper's id/class/aria survives here and
               each panel's markup lives in its component. The `hidden` classes
               are the pre-mount defaults; main.ts's watchEffect owns them from
               the first tick onward (it, not app.ts, is what renderPanels()
               became). -->
          <section id="dashboardPanel" class="dashboard hidden" aria-label="舰队总览"></section>
          <section id="profilePanel" class="profile-manager hidden" aria-labelledby="profileManagerTitle"></section>
          <section id="systemPanel" class="panel hidden" aria-label="系统组件"></section>

          <section id="createPanel" class="panel hidden"></section>

          <section id="emptyPanel" class="empty"></section>

          <div id="detailMount"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
