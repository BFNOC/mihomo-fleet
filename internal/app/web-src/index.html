<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mihomo Fleet</title>
  </head>
  <body>
    <div class="shell">
      <!-- Vue mount point: TopBar.vue supplies the contents. main.ts replaces
           the children of this element, so the wrapper and its class stay. -->
      <header class="topbar"></header>

      <main class="workspace">
        <!-- Vue mount point: SideBar.vue supplies the contents. -->
        <aside class="sidebar"></aside>

        <section class="content">
          <!-- Vue mount point: MessageBanner.vue renders the #message element
               itself, so it needs a host to be mounted into rather than being
               mounted onto #message directly. -->
          <div id="messageMount"></div>
          <section id="dashboardPanel" class="dashboard hidden" aria-label="舰队总览"></section>
          <section id="profilePanel" class="profile-manager hidden" aria-labelledby="profileManagerTitle">
            <div class="profile-manager-head">
              <div class="panel-title">
                <div>
                  <h2 id="profileManagerTitle">配置档管理</h2>
                  <p>配置档保存共享 YAML 或订阅，多个实例可以同时引用同一份配置。</p>
                </div>
              </div>
              <button id="newProfileBtn" class="primary" type="button">新建配置档</button>
            </div>
            <div class="profile-manager-grid">
              <nav class="profile-catalog" aria-label="配置档列表">
                <div class="profile-catalog-head">
                  <h3>配置档</h3>
                  <span id="profileCount">0 个</span>
                </div>
                <div id="profileList" class="profile-list"></div>
              </nav>
              <div class="profile-editor-pane">
                <div id="profileEditorEmpty" class="profile-editor-empty">
                  <h3>选择配置档</h3>
                  <p>从左侧选择已有配置档，或新建一份手写配置或订阅配置。</p>
                </div>
                <section id="profileEditor" class="hidden" aria-labelledby="profileEditorTitle">
                  <div class="profile-editor-head">
                    <div>
                      <h3 id="profileEditorTitle">配置档</h3>
                      <p id="profileMeta">未选择配置档。</p>
                    </div>
                    <span id="profileReferenceBadge" class="reference-badge">未使用</span>
                  </div>
                  <div class="form-grid profile-basics">
                    <label>
                      <span>名称</span>
                      <input id="profileName" placeholder="我的订阅">
                    </label>
                    <label>
                      <span>配置档 ID</span>
                      <input id="profileId" readonly>
                    </label>
                  </div>
                  <div id="profileSourceTabs" class="segmented hidden" role="group" aria-label="配置来源">
                    <button id="profileManualMode" class="active" type="button">手写配置</button>
                    <button id="profileSubscriptionMode" type="button">订阅链接</button>
                  </div>
                  <div id="subscriptionSettings" class="subscription-settings hidden">
                    <label class="stacked">
                      <span>订阅链接</span>
                      <input id="subscriptionUrl" placeholder="https://example.com/sub">
                    </label>
                    <div class="form-grid subscription-fields">
                      <label>
                        <span>更新间隔（分钟）</span>
                        <input id="subscriptionInterval" type="number" min="15" placeholder="360">
                      </label>
                      <label class="checkline">
                        <input id="subscriptionAutoUpdate" type="checkbox">
                        <span>自动更新</span>
                      </label>
                      <div id="subscriptionInfo" class="subscription-info"></div>
                    </div>
                    <div class="actions">
                      <button id="refreshSubscription" type="button">立即更新</button>
                    </div>
                  </div>
                  <div id="profileConfigSection">
                    <div class="config-editor-toolbar">
                      <div class="config-editor-heading">
                        <span id="configEditorLabel">YAML 配置</span>
                        <span id="configEditorStatus" class="config-editor-status" role="status" aria-live="polite">正在加载</span>
                      </div>
                      <div class="actions" role="toolbar" aria-label="配置编辑操作">
                        <button id="findConfig" type="button">查找</button>
                        <button id="discardConfig" type="button" disabled>放弃修改</button>
                      </div>
                    </div>
                    <div id="configEditor" class="code" aria-labelledby="configEditorLabel"></div>
                    <div id="configEditorError" class="config-editor-error hidden" role="alert"></div>
                  </div>
                  <p id="profileDeleteHint" class="profile-delete-hint"></p>
                  <div class="profile-editor-actions">
                    <button id="saveProfile" class="primary" type="button">保存配置档</button>
                    <button id="deleteProfile" class="danger" type="button">删除配置档</button>
                  </div>
                </section>
              </div>
            </div>
          </section>

          <section id="createPanel" class="panel hidden"></section>

          <section id="emptyPanel" class="empty"></section>

          <div id="detailMount"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
